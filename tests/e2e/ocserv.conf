# Certificate-only authentication: no username or password is accepted.
auth = "certificate"
socket-file = /run/ocserv-socket
tcp-port = 443
udp-port = 443

server-cert = /certs/server.pem
server-key  = /certs/server.key
ca-cert     = /certs/ca.pem

# Take the client's identity from the certificate CN.
cert-user-oid = 2.5.4.3

# Container-friendly: no privilege separation or chroot games.
isolate-workers = false
try-mtu-discovery = false

device = vpns
ipv4-network = 10.10.10.0
ipv4-netmask = 255.255.255.0
max-clients = 4
max-same-clients = 4
keepalive = 30
dpd = 60
mobile-dpd = 90
switch-to-tcp-timeout = 25
cisco-client-compat = true
dtls-legacy = true

# Push a split route so the client exercises install_pushed_routes without
# hijacking the test container's own default route.
route = 10.99.0.0/255.255.0.0
